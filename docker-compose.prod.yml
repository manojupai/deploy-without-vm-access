services:
  app:
    image: ${IMAGE}
    container_name: sample-node-app
    ports:
      - "4000:4000"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s