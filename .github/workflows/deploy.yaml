name: Build and Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Production
    needs: build

    runs-on: [self-hosted, production]

    steps:
      - name: Deploy
        run: |
          IMAGE="ghcr.io/manojupai/deploy-without-vm-access:${{ github.sha }}"

          echo "Deploying $IMAGE"

          docker pull "$IMAGE"

          IMAGE="$IMAGE" docker compose \
            -f ~/Documents/workspace/deployment/docker-compose.prod.yml \
            up -d

      - name: Check container logs
        run: |
          docker logs deploy-without-vm-access

      - name: Check deployment
        run: |
          echo "Waiting for application..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost:4000 > /dev/null; then
              echo "Application is healthy!"
              exit 0
            fi

            echo "Application not ready yet... attempt $i/30"
            sleep 2
          done

          echo "Application failed to become healthy"

          docker ps
          docker logs deploy-without-vm-access

          exit 1